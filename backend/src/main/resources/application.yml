server:
  port: 8080

spring:
  application:
    name: documind-backend

  datasource:
    url: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
    username: postgres.cqaookausoiljkdcoycr
    password: CodeSyncDbUser2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    openai:
      # Defaults to Google Gemini's OpenAI-compatible endpoint.
      # Can be switched to Groq (https://api.groq.com/openai/v1) or OpenAI by changing env vars.
      base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${GEMINI_API_KEY:${LLM_API_KEY:placeholder}}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:gemini-1.5-flash}
          temperature: 0.2
      embedding:
        options:
          model: ${LLM_EMBED_MODEL:text-embedding-004}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: true
        table-name: vector_store

# CORS configuration
app:
  cors:
    allowed-origins: "http://localhost:4200"
